title: Article
sections:
  main:
    display: Main
    fields:
      -
        handle: title
        field:
          type: text
          display: Title
      -
        handle: content
        field:
          type: bard
          display: Content
          remove_empty_nodes: true
          sets:
            main:
              display: Main
              sets:
                card:
                  display: Card
                  fields:
                    -
                      handle: label
                      field:
                        type: text
                        display: Label
      -
        handle: excerpt
        field:
          type: textarea
          display: Excerpt
          character_limit: 160
      -
        handle: author
        field:
          type: users
          display: Author
          default: current
      -
        handle: topics
        field:
          type: terms
          display: Topics
          taxonomies:
            - topics
          mode: select
